    Berlin meets Seoul — <span class="homepage-concerts__gold">JJ Group</span> brings a fresh, groove-driven sound to the modern jazz scene. Rooted in deep musical interplay, their music weaves intricate melodies with spontaneous improvisation, blending precision with freedom. Expect harmonic journeys that feel both contemplative and hopeful — jazz that moves you.

